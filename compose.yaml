services:
  postgres:
    image: postgres:18
    container_name: kingdomduel-postgres
    environment:
      POSTGRES_DB: KingdomDuel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - kingdomduel-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d KingdomDuel"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  kingdomduel-pgdata:
