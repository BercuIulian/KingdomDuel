name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # obligatoriu pentru OIDC — fără el, autentificarea la Google eșuează

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: us-east1
      SERVICE: kingdomduel
    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation: niciun secret de lungă durată în GitHub.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/kingdomduel/api:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Doar imaginea se schimbă: Cloud Run păstrează setările reviziei
      # anterioare (secrete, cont de serviciu, scalare). Env vars și secretele
      # se modifică deliberat, cu `gcloud run services update`, nu la fiecare push.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project=${{ secrets.GCP_PROJECT }}
